name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    env:
      # No Postgres service container exists for this job — DATABASE_URL/
      # DIRECT_URL must point at a real, reachable database. Deliberately no
      # localhost fallback: a silent fallback here previously meant a missing
      # secret failed deep inside `npm run test` with a confusing connection
      # error instead of a clear one (see the "Verify required secrets" step).
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # `npm run test` makes no Supabase Auth calls, but the gallery
      # integration tests (lib/editor/service.integration.test.ts) upload
      # to and delete from REAL Supabase Storage via the service-role
      # client — so these must be a real, reachable project, not
      # placeholders. The bucket must exist in that project (it is not
      # created automatically — see docs/STATUS.md's Phase 11 bucket note).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: invitation-assets
      PAYMENT_PROVIDER: test
      PAYMENT_API_KEY: ci-placeholder
      PAYMENT_WEBHOOK_SECRET: ci-placeholder
      EMAIL_PROVIDER: test
      EMAIL_API_KEY: ci-placeholder
      EMAIL_FROM: test@example.com
      WHATSAPP_PROVIDER: test
      WHATSAPP_API_KEY: ci-placeholder
      WHATSAPP_WEBHOOK_SECRET: ci-placeholder
      MAPS_PROVIDER: test
      MAPS_API_KEY: ci-placeholder
      ANALYTICS_PROVIDER: test
      ANALYTICS_API_KEY: ci-placeholder
      APP_SECRET: ci-only-placeholder-secret
      ERROR_MONITORING_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required CI secrets are configured
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing CI_DATABASE_URL"
          [ -z "$DIRECT_URL" ] && missing="$missing CI_DIRECT_URL"
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && missing="$missing CI_SUPABASE_URL"
          [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && missing="$missing CI_SUPABASE_ANON_KEY"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing CI_SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing — integration tests need a real, reachable Supabase Postgres database and Storage bucket. Configure these in the repository's GitHub Actions secrets."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      # Read-only. CI never applies migrations itself (CI_DATABASE_URL may
      # point at a shared DEV database) — a branch adding a migration must
      # have it applied to that database first. Fails clearly here rather
      # than as confusing test failures (e.g. lib/db/rls.integration.test.ts).
      - name: Verify database migrations are applied
        run: npx prisma migrate status

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test --if-present

      - name: Production build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      # e2e/*.spec.ts fixtures make REAL Supabase Auth Admin API calls
      # (admin.auth.admin.createUser) and exercise real login through the
      # app — these must be a real, reachable Supabase project, not
      # placeholders. A fake example.supabase.co + ci-placeholder key here
      # would make every spec fail at fixture setup.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: invitation-assets
      PAYMENT_PROVIDER: test
      PAYMENT_API_KEY: ci-placeholder
      PAYMENT_WEBHOOK_SECRET: ci-placeholder
      EMAIL_PROVIDER: test
      EMAIL_API_KEY: ci-placeholder
      EMAIL_FROM: test@example.com
      WHATSAPP_PROVIDER: test
      WHATSAPP_API_KEY: ci-placeholder
      WHATSAPP_WEBHOOK_SECRET: ci-placeholder
      MAPS_PROVIDER: test
      MAPS_API_KEY: ci-placeholder
      ANALYTICS_PROVIDER: test
      ANALYTICS_API_KEY: ci-placeholder
      APP_SECRET: ci-only-placeholder-secret
      ERROR_MONITORING_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required CI secrets are configured
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing CI_DATABASE_URL"
          [ -z "$DIRECT_URL" ] && missing="$missing CI_DIRECT_URL"
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && missing="$missing CI_SUPABASE_URL"
          [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && missing="$missing CI_SUPABASE_ANON_KEY"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing CI_SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secrets:$missing — E2E specs make real Supabase Auth calls and need a real, reachable project. Configure these in the repository's GitHub Actions secrets."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e --if-present

      # Diagnostic only — never affects test outcome (runs after tests
      # finish, only on failure). playwright.config.ts already writes this
      # report locally on every run; it's otherwise lost with the runner.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
