name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/digital_invitation_ci' }}
      DIRECT_URL: ${{ secrets.CI_DIRECT_URL || 'postgresql://postgres:postgres@localhost:5432/digital_invitation_ci' }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SUPABASE_STORAGE_BUCKET: invitation-media
      PAYMENT_PROVIDER: test
      PAYMENT_API_KEY: ci-placeholder
      PAYMENT_WEBHOOK_SECRET: ci-placeholder
      EMAIL_PROVIDER: test
      EMAIL_API_KEY: ci-placeholder
      EMAIL_FROM: test@example.com
      WHATSAPP_PROVIDER: test
      WHATSAPP_API_KEY: ci-placeholder
      WHATSAPP_WEBHOOK_SECRET: ci-placeholder
      MAPS_PROVIDER: test
      MAPS_API_KEY: ci-placeholder
      ANALYTICS_PROVIDER: test
      ANALYTICS_API_KEY: ci-placeholder
      APP_SECRET: ci-only-placeholder-secret
      ERROR_MONITORING_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test --if-present

      - name: Production build
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.CI_DIRECT_URL }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SUPABASE_STORAGE_BUCKET: invitation-media
      PAYMENT_PROVIDER: test
      PAYMENT_API_KEY: ci-placeholder
      PAYMENT_WEBHOOK_SECRET: ci-placeholder
      EMAIL_PROVIDER: test
      EMAIL_API_KEY: ci-placeholder
      EMAIL_FROM: test@example.com
      WHATSAPP_PROVIDER: test
      WHATSAPP_API_KEY: ci-placeholder
      WHATSAPP_WEBHOOK_SECRET: ci-placeholder
      MAPS_PROVIDER: test
      MAPS_API_KEY: ci-placeholder
      ANALYTICS_PROVIDER: test
      ANALYTICS_API_KEY: ci-placeholder
      APP_SECRET: ci-only-placeholder-secret
      ERROR_MONITORING_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e --if-present
